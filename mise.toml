[env]
AFFIRM_MISE_ACTIVE = "true"

[settings]
env_file = ".env"
disable_tools = ["aube", "bun", "npm", "yarn"]

[tools]
pnpm = { version = "12.9.1" }
node = { version = "26.10.0" }
rust = { version = "1.99.0" }

[tasks]
start = "pnpm run dev"
pr = "gh pr create --fill-verbose --draft --base staging"
